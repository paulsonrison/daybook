# Separate free preview. Do not adopt or rename existing services.
services:
  - type: web
    name: daybook-paulson-preview
    runtime: node
    plan: free
    region: singapore
    branch: codex/free-completion
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start-preview.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DAYBOOK_PREVIEW
        value: 'true'
      - key: DAYBOOK_AI_ENABLED
        value: 'false'
      - key: DAYBOOK_COMMUNICATIONS_PROVIDERS
        value: '{}'
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: daybook-preview-db
          property: connectionString
      - key: NEON_MIGRATION_DATABASE_URL
        sync: false
      - key: NEON_REHEARSAL_DATABASE_URL
        sync: false
      - key: DAYBOOK_DATABASE_TRANSFER_ID
        value: render-neon-20261115
      - key: PREVIEW_RUNTIME_PASSWORD
        generateValue: true
      - key: DOCUMENT_LINK_SECRET
        generateValue: true
databases:
  - name: daybook-preview-db
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: daybook_preview
    ipAllowList: []
